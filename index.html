<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sorrento Restaurant & Cafe 4.7⭐️</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    window.onerror = function(msg, url, line) {
      alert('JS Error: ' + msg + ' (line ' + line + ')');
    };
  </script>
</head>
<body>

  <h2 class="wall-title">Sorrento Restaurant & Cafe
<br>4.7⭐️</h2>

  <!-- Clean Photo Wall Area -->
  <main class="wall" id="photo-wall">
    <!-- Photos stack here -->
  </main>

  <!-- Photo Preview Modal (Appears after taking a photo so they can type a caption & check it) -->
  <div id="preview-modal" class="modal" style="display: none;">
    <div class="modal-content">
      <h3>the perfect moment📍</h3>
      <div class="preview-polaroid">
        <div class="image-container">
          <img id="preview-img" src="" alt="Preview" />
        </div>
        <input type="text" id="modal-caption-input" maxlength="10" placeholder="Caption (Max 10)" />
      </div>
      <div class="modal-buttons">
        <button id="retake-btn" class="secondary-btn">opps<br>Retake</button>
        <button id="confirm-upload-btn" class="primary-btn">Pin to Wall</button>
      </div>
    </div>
  </div>

  <!-- Big Noticeable Camera Button Fixed at Bottom Middle -->
  <footer class="footer-bar">
    <input type="file" id="camera-input" accept="image/*" capture="environment" style="display: none;">
    <label for="camera-input" class="snap-btn-large" id="open-camera-btn">capture your moment's<br>& pin it!📌</label>
  </footer>

  <script src="app.js"></script>
</body>
</html>
